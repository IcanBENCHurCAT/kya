# KYA Service — Production Docker Compose Stack
# Orchestrates kya-service (Hono app), Caddy reverse proxy, and DuckDNS dynamic DNS updater.

services:
  # ─── KYA Application ─────────────────────────────────────────────────────
  kya-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kya-service
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - ALGORAND_NETWORK_URL=${ALGORAND_NETWORK_URL:-https://mainnet-api.algonode.cloud}
      - ALGORAND_API_TOKEN=${ALGORAND_API_TOKEN:-}
      - SCREENING_FAIL_THRESHOLD=${SCREENING_FAIL_THRESHOLD:-0.85}
      - SCREENING_FLAG_THRESHOLD=${SCREENING_FLAG_THRESHOLD:-0.50}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - watchdata:/app/data
    networks:
      - kya-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Caddy Reverse Proxy & TLS Ingress ──────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: kya-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_SUBDOMAIN=${DUCKDNS_SUBDOMAIN:-kya-service}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      kya-service:
        condition: service_healthy
    networks:
      - kya-net
    restart: unless-stopped

  # ─── DuckDNS Dynamic DNS Updater ─────────────────────────────────────────
  duckdns-updater:
    image: curlimages/curl:latest
    container_name: duckdns-updater
    environment:
      - DUCKDNS_SUBDOMAIN=${DUCKDNS_SUBDOMAIN:-kya-service}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-300}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DUCKDNS_TOKEN" ]; then
          echo "DUCKDNS_TOKEN not set. Exiting DuckDNS updater."
          exit 0
        fi
        while true; do
          echo "Updating DuckDNS IP for domain $$DUCKDNS_SUBDOMAIN.duckdns.org..."
          curl -s "https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip="
          echo ""
          sleep $${UPDATE_INTERVAL:-300}
        done
    networks:
      - kya-net
    restart: unless-stopped

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  kya-net:
    driver: bridge

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  watchdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
