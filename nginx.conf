#
# KYA Service — Nginx Reverse Proxy Configuration
#
# Production-ready nginx config for the KYA Hono service.
# Handles TLS termination, security headers, and proxy forwarding.
#
# To use:
#   1. Place self-signed / Let's Encrypt certs in ./certs/
#   2. Override SERVER_NAME in .env or here
#   3. docker compose up --build
#
# Licensed under AGPL-3.0 — See LICENSE file for details.

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ─── Global ───────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ─── Upstream: KYA app (Docker internal network) ────────────────────
    upstream kya-backend {
        server kya:3000;
    }

    # ─── HTTP → HTTPS redirect ──────────────────────────────────────────
    server {
        listen 80;
        server_name $host;

        # Let's Encrypt ACME challenge (if using certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS main server ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name $host;

        # ─── TLS / SSL ──────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ─── Security Headers ───────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Rate Limiting (global zone) ────────────────────────────────
        limit_req_zone $binary_remote_addr zone=kya_limit:10m rate=30r/s;
        limit_req zone=kya_limit burst=50 nodelay;

        # ─── Timeouts ───────────────────────────────────────────────────
        client_body_timeout 12;
        client_header_timeout 12;
        send_timeout 10;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # ─── Max body size (bulk screening can be large) ────────────────
        client_max_body_size 10m;

        # ─── Health check (public, for load balancer probes) ────────────
        location /health {
            # Proxy to the app's /api/v1/health
            proxy_pass http://kya-backend/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── KYA API ────────────────────────────────────────────────────
        location /api/ {
            # Proxy pass to Hono app
            proxy_pass http://kya-backend;

            # Required proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed in the future)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Buffering disabled for streaming responses
            proxy_buffering off;
        }

        # ─── Default: 404 ───────────────────────────────────────────────
        location / {
            return 404 '{"error":"not found"}';
            default_type application/json;
        }
    }
}
