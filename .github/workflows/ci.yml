name: CI Quality Gate & Docker Build

on:
  push:
    branches: [ main, feature/* ]
    paths-ignore:
      - 'docs/**'
      - 'sdks/**'
      - 'examples/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'sdks/**'
      - 'examples/**'
      - '**.md'

jobs:
  ci-quality-gate:
    name: Typecheck & Vitest Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run TypeScript Compiler Build
        run: npm run build

      - name: Run Vitest Test Suite
        run: npm test

  build-multiarch-docker:
    name: Multi-Arch Docker Build (AMD64 / ARM64)
    runs-on: ubuntu-latest
    needs: ci-quality-gate
    # DISABLED: Automated deployment and OCIR pushes paused pending LLC formation
    if: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch ARM64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCI Container Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGION_ENDPOINT }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and Push Multi-Arch Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.OCIR_REGION_ENDPOINT }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/kya-service:latest
            ${{ secrets.OCIR_REGION_ENDPOINT }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/kya-service:${{ github.sha }}

