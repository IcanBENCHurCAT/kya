name: Unified Publish & Deploy

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target publish destination'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - npm
          - pypi

jobs:
  publish-npm:
    name: Publish TypeScript SDK (kya-sdk) to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.target == 'all' || inputs.target == 'npm'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Publish npm Package
        run: |
          cd sdk
          npm ci
          npm run build
          npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  publish-pypi:
    name: Publish Python SDK (kya-client) to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.target == 'all' || inputs.target == 'pypi'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hatchling & Build Wheel
        run: |
          cd python-sdk
          pip install hatchling twine
          python -m build

      - name: Publish PyPI Package
        run: |
          cd python-sdk
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }} || true
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        continue-on-error: true
