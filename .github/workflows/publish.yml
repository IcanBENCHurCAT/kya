name: Unified Publish & Deploy

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target publish destination'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - npm
          - pypi

jobs:
  publish-npm:
    name: Publish TypeScript SDK (kya-sdk) to npm
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.target == 'all' || inputs.target == 'npm'
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'sdk/package-lock.json'

      - name: Install, Test & Build npm Package
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Publish npm Package
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VER} is already published on npm; skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK (kya-client) to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.target == 'all' || inputs.target == 'pypi'
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling twine pytest
          pip install -e ".[dev]"
          pytest -v

      - name: Build Wheel & Source Distribution
        run: python -m build

      - name: Publish PyPI Package
        run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
